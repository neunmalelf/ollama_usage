[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-usage"
dynamic = ["version"]
description = "CLI and Python library to check your Ollama Cloud quota usage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "neunmalelf" }
]
keywords = ["ollama", "quota", "usage", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
notify = ["plyer"]
widget = ["PySide6"]
dev    = [
    "pytest",
    "pytest-cov",
    "plyer",
    "ruff",
    "bandit",
    "mypy",
    "nuitka",
]

[project.urls]
Homepage = "https://github.com/neunmalelf/ollama_usage"
Repository = "https://github.com/neunmalelf/ollama_usage"
"Bug Tracker" = "https://github.com/neunmalelf/ollama_usage/issues"
Changelog = "https://github.com/neunmalelf/ollama_usage/blob/main/CHANGELOG.md"

[project.scripts]
ollama-usage = "ollama_usage.cli:main"

[tool.setuptools]
packages = ["ollama_usage"]

[tool.setuptools.dynamic]
version = { attr = "ollama_usage.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
